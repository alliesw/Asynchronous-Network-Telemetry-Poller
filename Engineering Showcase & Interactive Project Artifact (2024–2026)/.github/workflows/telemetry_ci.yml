name: Async Telemetry Poller CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: telemetry_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
          
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio aiohttp psycopg2-binary

      - name: Lint Code with Ruff
        run: ruff check .

      - name: Run Async Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/telemetry_db
        run: |
          pytest tests/ --asyncio-mode=auto -v
